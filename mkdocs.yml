site_name: Sonic documentation
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate               # Kopjes worden zichtbaar
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: teal
      accent: purple
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: teal
      accent: lime

extra:
  social:
    - icon: fontawesome/brands/microsoft
      link: https://github.com/mandy-1312/mkdocs-material-tutorial

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list

copyright: |
  &copy: 2025 <a href="https://github.com/mandy-1312/mkdocs-material-tutorial" target="_blank" rel="noopener">Mandy Glasbeek</a>